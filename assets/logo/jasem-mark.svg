<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="آقا جاسم" color="#1C1712">
  <title>آقا جاسم</title>
  <!--
    «چشمِ باز» in a bottle cap.

    A crimped soda-bottle cap — 1960s Zamzam/Coca-Cola shop furniture — holding
    the کلاه مخملی over a winking eye. The mark IS the tagline: «خرید با چشمِ
    باز». The hat carries the era and the backstory; the wink carries the
    character — cheeky, in on it, doing you a favour — without ever drawing his
    face. The crimped edge is a distinctive silhouette at 24px in a way no
    rounded square can be.

    The keyline follows currentColor so the mark can sit on any of the poster
    grounds; the inks inside are fixed, like any printed label.
  -->
  <path fill="#D93A1F" stroke="currentColor" stroke-width="4" stroke-linejoin="round"
        d="M60.0 4.0 L67.53 10.06 L76.51 6.49 L81.91 14.5 L91.55 13.73 L94.35 22.98 L103.78 25.08 L103.73 34.75 L112.13 39.54 L109.23 48.76 L115.84 55.82 L110.36 63.77 L114.6 72.46 L107.01 78.45 L108.5 88.0 L99.48 91.49 L98.09 101.05 L88.45 101.73 L84.3 110.45 L74.89 108.26 L68.35 115.37 L60.0 110.5 L51.65 115.37 L45.11 108.26 L35.7 110.45 L31.55 101.73 L21.91 101.05 L20.52 91.49 L11.5 88.0 L12.99 78.45 L5.4 72.46 L9.64 63.77 L4.16 55.82 L10.77 48.76 L7.87 39.54 L16.27 34.75 L16.22 25.08 L25.65 22.98 L28.45 13.73 L38.09 14.5 L43.49 6.49 L52.47 10.06 Z"/>
  <!-- The pressed inner ring of the cap. -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="#E6E0CE" stroke-width="2" opacity="0.65"/>
  <!-- کلاه مخملی — same drawing as the object set, paper ink. -->
  <g transform="translate(60 47) scale(1.05) translate(-32 -32)" fill="#E6E0CE">
    <path d="M20 40 L20.5 25 Q21 16 32 16 Q43 16 43.5 25 L44 40 Z"/>
    <path d="M6 43.5 Q32 53 58 43.5 Q32 36.5 6 43.5 Z"/>
    <path d="M19 32.4 H45 v4.4 H19 Z" fill="#D93A1F"/>
    <path d="M26.6 18.2 Q32 21.4 37.4 18.2" fill="none" stroke="#D93A1F"
          stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <!-- The wink. One eye, shut mid-mischief, three lashes. -->
  <g fill="none" stroke="#E6E0CE" stroke-width="4.5" stroke-linecap="round">
    <path d="M44 80 Q60 91 76 80"/>
    <path d="M50 87.5 L47 92.5 M60 89.5 L60 95 M70 87.5 L73 92.5" stroke-width="3.5"/>
  </g>
</svg>
