<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پیدا نشد — آقا جاسم</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/icon/favicon.svg" type="image/svg+xml">
<!--
  Root-absolute paths are correct HERE and only here. GitHub serves this file
  for any missing URL at any depth, so /gone/deeper/still would resolve relative
  assets against /gone/deeper/. check_links.py skips this file for that reason.
-->
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  body { display: grid; place-items: center; min-block-size: 100svh; }
  .lost { text-align: center; display: grid; gap: var(--jsm-space-5);
          justify-items: center; padding: var(--jsm-space-6); }
  .lost__code { font-family: var(--jsm-font-family-poster);
                font-size: clamp(6rem, 30vw, 14rem);
                line-height: .8; color: var(--jsm-color-ink-shangarf); }
  .lost__msg { font-size: clamp(1.0625rem, 3vw, 1.375rem); max-inline-size: 34ch; }
  .lost__mark { inline-size: 64px; }
  /* The desk fan turns while he is out looking. Blades only — the cage and
     base never move. Reduced motion parks it via base.css. */
  .lost__fan { inline-size: 72px; color: var(--jsm-color-poster-fg-muted); }
  /* The misregister device lives here now — this page is its last user. */
  .misregister { position: relative; display: inline-block; }
  .misregister > .ghost {
    position: absolute;
    inset-block-start: var(--jsm-metric-misregister);
    inset-inline-start: calc(var(--jsm-metric-misregister) * -1);
    white-space: nowrap;
    color: var(--jsm-color-ink-surati);
    mix-blend-mode: multiply;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
  <main class="lost">
    <img class="lost__mark logo" src="/assets/logo/jasem-mark.svg" alt="" width="64" height="64">
    <svg class="lost__fan" viewBox="0 0 64 64" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="3"
         stroke-linejoin="round" stroke-linecap="round">
        <circle cx="32" cy="27" r="19"/>
        <g class="fan__blades" fill="currentColor" stroke-width="2.4">
          <path d="M32 27 Q22 15 30 10 Q37 13 32 27 Z"/>
          <path d="M32 27 Q17 30 18 39 Q25 43 32 27 Z"/>
          <path d="M32 27 Q45 35 46 27 Q44 19 32 27 Z"/>
        </g>
        <circle cx="32" cy="27" r="3.4" fill="currentColor" stroke="none"/>
        <path d="M32 46 V52"/>
        <path d="M20 58 Q32 52 44 58 Z" fill="currentColor"/>
      </g>
    </svg>
    <p class="lost__code misregister">
      <span class="ghost" aria-hidden="true">۴۰۴</span>۴۰۴
    </p>
    <p class="lost__msg">
      این‌جا رو گشتم، نبود. شاید آدرس‌و اشتباه نوشتی — یا من هنوز نساختمش.
    </p>
    <a class="store" href="/" style="text-decoration:none">
      <span class="store__name">برگرد سر خونه</span>
      <span class="store__note">aghajasem.ir</span>
    </a>
  </main>
</body>
</html>
